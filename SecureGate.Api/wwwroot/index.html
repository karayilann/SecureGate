<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SecureGate Admin</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <section id="login-view" class="login">
        <form id="login-form" class="card">
            <h1>SecureGate</h1>
            <p class="subtitle">Admin Panel</p>
            <label>Email
                <input id="email" type="email" value="admin@securegate.local" required />
            </label>
            <label>Password
                <span class="password-field">
                    <input id="password" type="password" required />
                    <button type="button" id="toggle-password" class="toggle" aria-label="Show password">👁</button>
                </span>
            </label>
            <button type="submit">Sign In</button>
            <p id="login-error" class="error" hidden></p>
        </form>
    </section>

    <section id="dashboard-view" class="dashboard" hidden>
        <header class="topbar">
            <span class="brand">SecureGate</span>
            <nav>
                <button class="nav-btn active" data-page="keys">Keys</button>
                <button class="nav-btn" data-page="usage">Usage</button>
                <button class="nav-btn" data-page="anomalies">Anomalies</button>
                <button class="nav-btn" data-page="health">Health</button>
                <button class="nav-btn" data-page="playground">Playground</button>
            </nav>
            <button id="logout" class="ghost">Logout</button>
        </header>
        <main id="content" class="content"></main>
    </section>

    <div id="toast-container" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
